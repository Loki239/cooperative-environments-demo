function block(x,y,w,h,d,top,front,side,stroke='#47776b'){return `<path d="M${x} ${y}l${d} ${-d*.55}h${w}l${-d} ${d*.55}Z" fill="${top}" stroke="${stroke}" stroke-width="3"/><path d="M${x+w} ${y}l${d} ${-d*.55}v${h}l${-d} ${d*.55}Z" fill="${side}" stroke="${stroke}" stroke-width="3"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${front}" stroke="${stroke}" stroke-width="3"/>`}
function isometric(i,p,state){let move=i<3?0:i===3?ease(p/.62)*108:108;let cap=i<5?0:i===5?ease(p/.62):1;let ins=i<1?0:i===1?ease(p/.62):1;return `<ellipse cx="364" cy="479" rx="239" ry="36" fill="#d7e7de"/>
${block(125,372,218,81,90,'#e1ece0','#b9d4c4','#89b5a5')}${block(304,322,60,154,93,'#eff2e6','#c5decb','#8fbba4')}

${i>=1?`<g transform="translate(0 ${-55*(1-ins)})">${block(258,317,26,42,20,'#63a4a3',C.perform,'#07565c')}</g>`:''}

if(i===6){body=`<path d="M164 417H554" stroke="#82b7a4" stroke-width="49"/><circle cx="360" cy="393" r="76" fill="#294b40" stroke="#b8ddc4" stroke-width="6"/><path d="M307 393H413" transform="rotate(${90*ease(p/.62)} 360 393)" stroke="${col}" stroke-width="17" stroke-linecap="round"/>${p>=.62?`<circle cx="529" cy="296" r="37" fill="${col}"/><path d="M510 295l14 14 26-30" fill="none" stroke="white" stroke-width="7"/>`:''}`;}

function seek(ms){current=clamp(ms/durationMs)*durationMs;let i=Math.min(6,Math.floor(current/stepMs)),p=current===durationMs?1:(current-i*stepMs)/stepMs;let state=CLIP.frames[i+(p>=.62?1:0)],dark=variant==='closeup';svg.innerHTML=header(dark,i)+(variant==='cutaway'?cutaway(i,p,state):variant==='isometric'?isometric(i,p,state):closeup(i,p,state))+footer(i,p,state,dark);svg.dataset.step=String(i+9);svg.dataset.head=state.head_condition;svg.dataset.cavity=state.cavity_reading;svg.dataset.retainer=state.retainer_reading;svg.dataset.land=state.land_reading;svg.dataset.complete=String(state.cold_isolated);const slider=document.getElementById('seek');if(slider)slider.value=String(current);}

function play(){playing=!playing;document.getElementById('play').textContent=playing?'Пауза':'Смотреть';if(playing){startAt=current===durationMs?0:current;startTime=performance.now();requestAnimationFrame(tick);}}
function tick(t){if(!playing)return;seek(startAt+t-startTime);if(current<durationMs)requestAnimationFrame(tick);else{playing=false;document.getElementById('play').textContent='Смотреть';}}
